spring.application.name=app

# DATABASE
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.minimum-idle=0

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===============================
# JWT SECRET KEY
# ===============================
jwt.secret-key=${JWT_SECRET}

storage.teEcclesia.key=${STORAGE_TEECCLESIA_KEY}
storage.teEcclesia.secret=${STORAGE_TEECCLESIA_SECRET}
storage.teEcclesia.endpoint=${STORAGE_TEECCLESIA_ENDPOINT}
storage.teEcclesia.cdn-endpoint=${STORAGE_TEECCLESIA_CDN_ENDPOINT}
storage.teEcclesia.bucket=${STORAGE_TEECCLESIA_BUCKET}

identity.resources.profile-image-directory=${PROFILE_IMAGE_DIRECTORY}

# Multipart file size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

file-size.modules.identity=5

server.forward-headers-strategy=framework

internal.api.base-url=${INTERNAL_API_BASE_URL:http://localhost:8080}
email.service.url=${EMAIL_SERVICE_URL:}
teEcclesia.hmac.secret-key=${TEECCLESIA_HMAC_SECRET_KEY:}

# WhatsApp Verification
whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
whatsapp.business-number=${WHATSAPP_BUSINESS_NUMBER:1234567890}
whatsapp.business-phone=${WHATSAPP_BUSINESS_PHONE:15551951613}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}